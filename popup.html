<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Echoverse</title>
    <script src="tailwindcss.js"></script>
    <style>
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #2563eb;
      }
    </style>
  </head>

  <body class="bg-gray-100 p-5 w-[400px]">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-5">
      <div class="mb-5 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-gray-800">Chuông báo</h2>
        <button id="sound-toggle" class="focus:outline-none" type="button">
          <img
            id="sound-toggle-icon"
            src="/assets/noti.png"
            alt="Sound On"
            width="24"
            height="24"
          />
        </button>
      </div>

      <div class="space-y-4">
        <label class="inline-flex items-center cursor-pointer">
          <input id="hourly-toggle" type="checkbox" class="sr-only peer" />
          <div class="relative w-9 h-5 bg-neutral-quaternary peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-200 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-700"></div>
          <span class="select-none ms-3 text-sm font-medium text-gray-800">Theo giờ</span>
        </label>

        <div id="hourly-settings" class="hidden">
          <label for="hourly-message" class="block mb-2.5 text-sm font-medium text-gray-800">Lời nhắn</label>
          <input
            type="text"
            id="hourly-message"
            class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 shadow-xs placeholder:text-gray-400"
            placeholder="Nhập lời nhắn"
          />
        </div>

        <label class="inline-flex items-center cursor-pointer">
          <input id="recurring-toggle" type="checkbox" class="sr-only peer" checked />
          <div class="relative w-9 h-5 bg-neutral-quaternary peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-200 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-700"></div>
          <span class="select-none ms-3 text-sm font-medium text-gray-800">Lặp lại</span>
        </label>

        <div id="recurring-settings" class="space-y-4">
          <label for="recurring-interval" class="block mb-2.5 text-sm font-medium text-gray-800">Số phút</label>
          <input
            id="recurring-interval"
            type="number"
            min="1"
            step="1"
            value="30"
            class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 shadow-xs placeholder:text-gray-400"
            placeholder="30"
          />

          <label for="recurring-message" class="block mb-2.5 text-sm font-medium text-gray-800">Lời nhắn</label>
          <input
            type="text"
            id="recurring-message"
            class="block w-full px-3 py-2.5 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 shadow-xs placeholder:text-gray-400"
            placeholder="Nhập lời nhắn"
          />
        </div>
      </div>

      <div class="mt-4 flex justify-between items-center">
        <button
          id="start-timer"
          type="button"
          class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2.5 me-2 mb-2"
        >
          Bắt đầu
        </button>
      </div>

      <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
        <div class="rounded-lg bg-blue-50 p-3">
          <p class="text-gray-500">Hôm nay</p>
          <p id="today-count" class="text-lg font-semibold text-blue-700">0</p>
        </div>
        <div class="rounded-lg bg-amber-50 p-3">
          <p class="text-gray-500">Streak</p>
          <p id="streak-count" class="text-lg font-semibold text-amber-700">0</p>
        </div>
      </div>
    </div>

    <div
      id="status-box"
      class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-5 mt-4 hidden"
    >
      <p id="status" class="text-sm text-blue-600"></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
